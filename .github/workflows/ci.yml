name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    # macos-15 is an Apple silicon (arm64) runner.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      # Pin Xcode so the Swift version does not change with the runner image.
      - run: sudo xcode-select -s /Applications/Xcode_26.3.app
      - run: swift --version
      - run: swift build
      - run: swift test
