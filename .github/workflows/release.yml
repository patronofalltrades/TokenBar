name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write # npm trusted publishing (OIDC) and provenance. No npm token secret.

jobs:
  release:
    # macos-15 is an Apple silicon (arm64) runner. Keep the runner and Xcode the same as ci.yml.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - run: sudo xcode-select -s /Applications/Xcode_26.3.app
      - run: scripts/build-app.sh "$GITHUB_REF_NAME"
      - run: |
          { echo 'SHA-256:'; echo '```'; cat SHA256SUMS; echo '```'; } > notes.md
          # A version with a hyphen (v0.1.0-alpha.1) is a prerelease on GitHub.
          pre=''; [[ "$GITHUB_REF_NAME" == *-* ]] && pre='--prerelease'
          gh release create "$GITHUB_REF_NAME" TokenBar.zip SHA256SUMS --title "$GITHUB_REF_NAME" --notes-file notes.md $pre
        env:
          GH_TOKEN: ${{ github.token }}
      # Staged publishing needs Node 22.14.0 or later and npm 11.15.0 or later (TRD Section 13).
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm install -g 'npm@^11.15.0'
      - run: |
          cp TokenBar.zip LICENSE npm/
          cd npm
          npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version
          # npm 11 stops a prerelease version (v0.1.0-alpha.1) without --tag. The alpha is the only channel, so use latest.
          # Staged publish needs no 2FA. The maintainer approves the stage on npmjs.com with 2FA (IES-218).
          npm stage publish --provenance --access public --tag latest
